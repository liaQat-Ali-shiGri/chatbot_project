<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLaMA 3 Chatbot</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fas fa-robot" style="color: #4caf50;"></i> LLaMA 3</h2>
                <p>AI Chatbot</p>
                <button id="theme-toggle" class="theme-toggle-btn">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
            
            <button id="new-chat-btn" class="new-chat-btn">
                <i class="fas fa-plus-circle"></i> New Chat
            </button>
            
            <div class="chat-history">
                <h3><i class="fas fa-history"></i> Chat History</h3>
                <div id="history-list">
                    <div class="history-item active" data-session="current">
                        <i class="fas fa-comment"></i> Current Chat
                    </div>
                </div>
            </div>
            
            <div class="analytics-link-container">
                <div class="analytics-item" id="analytics-link">
                    <i class="fas fa-chart-line"></i> Analytics Dashboard
                </div>
            </div>
            
            <div class="user-info-sidebar">
                <div class="user-avatar">
                    <i class="fas fa-user-circle"></i>
                </div>
                <div class="user-details">
                    <span id="sidebar-user-name">Guest</span>
                    <small id="sidebar-user-email">Not logged in</small>
                </div>
                <button id="sidebar-logout" class="logout-side-btn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>
        
        <!-- Main Chat Area -->
        <main class="chat-main">
            <div class="chat-header">
                <h1><i class="fas fa-comments"></i> AI Chat Assistant</h1>
                <button id="end-session-btn" class="end-session-btn" title="End this session and save its analytics summary" aria-label="End Session">
                    <i class="fas fa-flag-checkered"></i> <span class="btn-label">End Session</span>
                </button>
            </div>
            
            <div id="chat-messages" class="chat-messages">
                <div class="welcome-message">
                    <i class="fas fa-robot" style="font-size: 48px; color: #4caf50;"></i>
                    <p>Please login to start chatting with LLaMA 3.</p>
                </div>
            </div>
            
            <div class="chat-input-container">
                <textarea id="message-input" placeholder="Type your message..." rows="2"></textarea>
                <button id="send-btn" class="send-btn" disabled>
                    <i class="fas fa-paper-plane"></i> Send
                </button>
            </div>
        </main>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
    <script src="/script.js"></script>
</body>
</html>
