<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LLaMA 3 Chatbot</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: white;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            width: 400px;
        }
        .login-container h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #333;
        }
        .login-container p {
            color: #666;
            margin-bottom: 30px;
        }
        .google-btn {
            background: #4285f4;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            transition: background 0.3s;
        }
        .google-btn:hover {
            background: #357ae8;
        }
        .robot-icon {
            font-size: 70px;
            color: #4caf50;
            margin-bottom: 20px;
        }
        .login-error {
            margin-top: 20px;
            padding: 10px 14px;
            border-radius: 8px;
            background: #fdeaea;
            color: #c62828;
            font-size: 14px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="robot-icon">
            <i class="fas fa-robot"></i>
        </div>
        <h1>LLaMA 3 Chatbot</h1>
        <p>AI-Powered Conversational Assistant</p>
        <a href="/login/google" class="google-btn">
            <i class="fab fa-google"></i> Sign in with Google
        </a>
        <p class="login-error" id="login-error" hidden>
            Sign-in did not complete. Please try again. If it keeps failing, check the server window:
            the database or Google sign-in settings may not be reachable.
        </p>
    </div>
    <script>
        // The server adds ?login_error=1 when the Google sign-in could not be completed.
        document.getElementById("login-error").hidden = !new URLSearchParams(location.search).has("login_error");
    </script>
</body>
</html>
